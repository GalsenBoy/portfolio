<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bilaly Cissokho — Développeur full-stack & apps mobiles</title>
    <meta
      name="description"
      content="Développeur full-stack, je crée des applications mobiles iOS et Android avec React Native, Expo et Supabase, de l'idée jusqu'aux stores. Découvrez mes projets."
    />
    <meta name="author" content="Bilaly Cissokho" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b0c" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Partage (Open Graph / Twitter). Canonical, og:url et og:image sont ajoutés au build via SITE_URL (vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Bilaly Cissokho" />
    <meta property="og:title" content="Bilaly Cissokho — Développeur full-stack & apps mobiles" />
    <meta
      property="og:description"
      content="Des apps qui vivent dans ta poche : applications mobiles iOS et Android, de la première ligne de code jusqu'au store."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Données structurées (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bilaly Cissokho",
        "alternateName": "GalsenBoy",
        "jobTitle": "Développeur full-stack",
        "sameAs": ["https://github.com/GalsenBoy", "https://linkedin.com/in/bilalycissokho"],
        "knowsAbout": [
          "React Native",
          "Expo",
          "React",
          "TypeScript",
          "Supabase",
          "Rust",
          "Développement mobile iOS",
          "Développement mobile Android"
        ],
        "description": "Développeur full-stack spécialisé dans les applications mobiles iOS et Android avec React Native, Expo et Supabase."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
